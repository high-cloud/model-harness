repos:
  - repo: local
    hooks:
      - id: check-docs
        name: Check standalone documentation
        entry: python3 tools/check_docs.py
        language: system
        pass_filenames: false
        always_run: true
      - id: test-checker
        name: Test documentation checker
        entry: python3 -m unittest discover -s tests -v
        language: system
        pass_filenames: false
        always_run: true
