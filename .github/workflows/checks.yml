name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 tools/check_docs.py
      - run: python3 -m unittest discover -s tests -v
